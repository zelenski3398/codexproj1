name: Publish browser game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Godot and web templates
        run: |
          bash tools/install_godot_web.sh
          echo /tmp/first-sortie-godot >> "$GITHUB_PATH"
      - name: Check controls, combat, interception, Survival, Malta terrain and audio
        run: |
          godot --headless --path . --editor --import --quit
          godot --headless --path . --fixed-fps 120 --script res://tests/universal_damage_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/aircraft_failure_flight_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/aircraft_failure_ai_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/component_damage_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/intro_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/keyboard_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/weapons_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/impact_audio_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/aircraft_impact_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/aircraft_damage_hud_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/italian_aircraft_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/malta_encounter_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/harbour_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/harbour_hangar_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/hurricane_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/hurricane_flight_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/hurricane_performance_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/harbour_support_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/harbour_radio_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/wingman_radio_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/harbour_flight_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/harbour_departure_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/mission_return_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/minimal_hud_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/aa_hud_context_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/interception_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/interception_siren_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/interception_combat_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/interception_departure_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/survival_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/malta_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/malta_terrain_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/st_elmo_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/valletta_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/mdina_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/cottonera_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/maltese_vegetation_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/rural_flight_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/countryside_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/countryside_departure_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/recovery_wreck_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/pilot_recovery_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/hangar_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/airfield_ground_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/malta_roads_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/base_access_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/dive_defence_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/dive_attack_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/audio_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/flyby_audio_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/mission_radio_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/pilot_character_checks.gd
          xvfb-run -a godot --path . --audio-driver Dummy --script res://tests/intro_playback_checks.gd
          xvfb-run -a godot --path . --audio-driver Dummy --disable-render-loop --fixed-fps 120 --script res://tests/aa_mouse_checks.gd
          xvfb-run -a godot --path . --audio-driver Dummy --disable-render-loop --fixed-fps 120 --script res://tests/battery_command_ui_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/battery_command_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/bofors_predictor_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/bofors_battery_fire_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/battery_engagement_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/defence_sound_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/layered_aa_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/aa_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/aa_presentation_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/flak_damage_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/airfield_controls_checks.gd
      - name: Export browser game
        run: bash tools/build_web.sh
      - name: Verify exported game payload
        run: |
          for file in index.html index.js index.wasm index.pck; do
            test -s "builds/web/$file" || { echo "::error::Missing or empty browser export: $file"; exit 1; }
          done
      - name: Save downloadable browser build
        uses: actions/upload-artifact@v4
        with:
          name: first-sortie-web
          path: builds/web/
          include-hidden-files: true
      - name: Upload Pages deployment artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: builds/web/
          retention-days: 7
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify this run uploaded a Pages artifact
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        run: |
          test -n "$PAGES_ARTIFACT_ID" || { echo "::error::No Pages artifact was produced. Start a fresh workflow run or re-run all jobs, including build."; exit 1; }
      - uses: actions/configure-pages@v6
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
