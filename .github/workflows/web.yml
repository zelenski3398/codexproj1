name: Publish browser game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Godot and web templates
        run: |
          bash tools/install_godot_web.sh
          echo /tmp/first-sortie-godot >> "$GITHUB_PATH"
      - name: Check controls, combat, interception, Survival, Malta terrain and audio
        run: |
          godot --headless --path . --editor --import --quit
          godot --headless --path . --fixed-fps 120 --script res://tests/keyboard_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/weapons_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/italian_aircraft_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/interception_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/interception_combat_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/interception_departure_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/survival_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/malta_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/malta_terrain_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/airfield_ground_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/malta_roads_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/base_access_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/dive_defence_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/dive_attack_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/audio_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/mission_radio_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/pilot_character_checks.gd
          xvfb-run -a godot --path . --audio-driver Dummy --disable-render-loop --fixed-fps 120 --script res://tests/aa_mouse_checks.gd
          xvfb-run -a godot --path . --audio-driver Dummy --disable-render-loop --fixed-fps 120 --script res://tests/battery_command_ui_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/battery_command_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/battery_engagement_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/defence_sound_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/layered_aa_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/aa_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/aa_presentation_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/flak_damage_checks.gd
          godot --headless --path . --fixed-fps 120 --script res://tests/airfield_controls_checks.gd
      - name: Export browser game
        run: bash tools/build_web.sh
      - name: Save downloadable browser build
        uses: actions/upload-artifact@v4
        with:
          name: first-sortie-web
          path: builds/web/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web/
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
