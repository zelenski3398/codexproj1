name: Publish browser game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Godot and web templates
        run: |
          bash tools/install_godot_web.sh
          echo /tmp/first-sortie-godot >> "$GITHUB_PATH"
      - name: Check controls, combat, interception, Survival, Malta terrain and audio
        run: |
          godot --headless --path . --editor --import --quit
          python3 -m unittest discover -s tests -p test_publishing_runner.py
          python3 tools/run_godot_checks.py
      - name: Save check results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-check-logs
          path: builds/checks/
          retention-days: 7
          if-no-files-found: ignore
      - name: Export browser game
        run: bash tools/build_web.sh
      - name: Verify exported game payload
        run: |
          for file in index.html index.js index.wasm index.pck; do
            test -s "builds/web/$file" || { echo "::error::Missing or empty browser export: $file"; exit 1; }
          done
      - name: Save downloadable browser build
        uses: actions/upload-artifact@v4
        with:
          name: first-sortie-web
          path: builds/web/
          include-hidden-files: true
      - name: Upload Pages deployment artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: builds/web/
          retention-days: 7
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify this run uploaded a Pages artifact
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        run: |
          test -n "$PAGES_ARTIFACT_ID" || { echo "::error::No Pages artifact was produced. Start a fresh workflow run or re-run all jobs, including build."; exit 1; }
      - uses: actions/configure-pages@v6
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
