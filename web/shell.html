<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Wings Over Malta: fly a Spitfire or Sea Gladiator and face a Stuka over Malta or a WWII countryside airfield.">
<title>Wings Over Malta</title>
$GODOT_HEAD_INCLUDE
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#101b17;color:#e9e8d7;font:16px/1.55 system-ui,sans-serif;overflow:hidden}
#game{position:fixed;inset:0;background:#101b17}
canvas{display:block;width:100%;height:100%;outline:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;padding:30px;background:#101b17}
#loading[hidden],button[hidden],progress[hidden]{display:none}
.loading-panel{width:min(420px,100%);text-align:center}
#status{overflow-wrap:anywhere}
progress{display:block;width:100%;height:8px;accent-color:#e4bf75;margin:18px 0}
button{border:1px solid #e4bf75;border-radius:3px;background:#e4bf75;color:#17211a;font:700 15px system-ui;padding:15px 25px;cursor:pointer}
button:focus-visible{outline:3px solid white;outline-offset:4px}
</style>
</head>
<body>
<div id="game"><canvas id="canvas" tabindex="0" aria-label="Wings Over Malta game">Your browser needs canvas and WebGL 2 support.</canvas></div>
<div id="loading">
<div class="loading-panel">
<div id="status" role="status" aria-live="polite">Loading Wings Over Malta…</div>
<progress id="progress" aria-label="Loading game"></progress>
<button id="retry" type="button" hidden>TRY AGAIN</button>
<noscript><p>JavaScript is required to run the game.</p></noscript>
</div>
</div>
<script src="$GODOT_URL"></script>
<script>
'use strict';
const config = $GODOT_CONFIG;
const engine = new Engine(config);
const overlay = document.getElementById('loading');
const status = document.getElementById('status');
const progress = document.getElementById('progress');
const retry = document.getElementById('retry');
const canvas = document.getElementById('canvas');
let loading = false;
const missing = Engine.getMissingFeatures({threads: $GODOT_THREADS_ENABLED});
canvas.addEventListener('pointerdown',()=>canvas.focus());
async function startGame(){
  if(loading || missing.length) return;
  loading = true;
  retry.hidden = true;
  progress.hidden = false;
  progress.removeAttribute('value');
  status.textContent = 'Loading Wings Over Malta…';
  window.firstSortieReady = false;
  try{
    await engine.startGame({canvas:canvas,onProgress:(current,total)=>{
      if(total>0){progress.max=total;progress.value=current}
      else{progress.removeAttribute('value')}
    }});
    overlay.hidden = true;
    canvas.focus();
    window.firstSortieReady = true;
  }catch(error){
    console.error(error);
    status.textContent = 'The game could not start. '+String(error.message||error);
    retry.hidden = false;
    loading = false;
    progress.hidden = true;
  }
}
retry.addEventListener('click',startGame);
if(missing.length){
  progress.hidden = true;
  status.textContent = 'This browser cannot run the game: ' + missing.join(', ') + '. Try an up-to-date desktop browser with hardware acceleration enabled.';
}else{
  startGame();
}
</script>
</body>
</html>
